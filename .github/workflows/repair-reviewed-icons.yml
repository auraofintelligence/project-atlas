name: Repair reviewed project icons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-reviewed-icons.yml'
      - 'scripts/reconcile_public_catalogue.py'
permissions:
  contents: write
concurrency:
  group: public-atlas-reconciliation
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow cairosvg
      - name: Repair and validate all eleven newly reviewed icons
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/reconcile_public_catalogue.py --repair-icons
      - name: Commit validated artwork only
        run: |
          git add data/project-icons.json assets/project-icons
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'project-atlas-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair reviewed project icons using original artwork'
          git push origin HEAD:main
